name: Python tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Capture test environment
        if: always()
        run: |
          mkdir -p test-results
          python --version | tee test-results/python-version.txt
          python -m pip freeze | tee test-results/pip-freeze.txt
          python -m pip check 2>&1 | tee test-results/pip-check.txt
      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results/junit.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
