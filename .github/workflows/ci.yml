name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check static/app.js && node --check static/puzzle.js && node --check static/game-agent.js && node --check static/reward-ledger.js && node --check static/due-diligence.js && node --check static/discovery-provenance.js && node --check static/opportunity-economics.js && node --test tests/reward-ledger.test.js tests/game-agent.test.js tests/due-diligence.test.js tests/discovery-provenance.test.js tests/opportunity-lifecycle.integration.test.js tests/opportunity-economics.test.js
      - name: Test browser-agent navigation and page classification
        working-directory: integrations/browser-agent
        run: npm install --ignore-scripts --no-audit --no-fund && node --check approved-url.mjs && node --check runner.mjs && node --check play-2048.mjs && node --check play-local-ai.mjs && node --check play-tic-tac-toe.mjs && node --check play-detected-game.mjs && node --check games/2048-strategy.mjs && node --check games/2048-episode-simulator.mjs && node --check games/run-2048-heuristic-comparison.mjs && node --check play-local-ai.mjs && node --check play-tic-tac-toe.mjs && node --check play-detected-game.mjs && node --check ollama-decision-provider.mjs && node --check ollama-game-perception.mjs && node --check game-rule-extractor.mjs && node --check game-cell-browser-adapter.mjs && node --check connect-four-browser-adapter.mjs && node --check othello-browser-adapter.mjs && node --check game-outcome-detector.mjs && node --check game-instruction-discovery.mjs && node --check game-site-discovery.mjs && node --check game-experience-memory.mjs && node --check experience-verification.mjs && node --check rate-game-experience.mjs && npm test
      - name: Run bounded paired 2048 heuristic experiment
        working-directory: integrations/browser-agent
        env:
          AUTOEARN_2048_EPISODES: "20"
          AUTOEARN_2048_DEPTH: "2"
          AUTOEARN_2048_MAX_MOVES: "500"
        run: |
          AUTOEARN_2048_SNAKE_WEIGHT=0.25 node games/run-2048-heuristic-comparison.mjs
          AUTOEARN_2048_SNAKE_WEIGHT=0.5 node games/run-2048-heuristic-comparison.mjs
          AUTOEARN_2048_SNAKE_WEIGHT=1 node games/run-2048-heuristic-comparison.mjs
      - name: Check paired 2048 experiment entrypoints
        working-directory: integrations/browser-agent
        run: node --check games/2048-policy-comparison.mjs && node --check games/run-2048-policy-comparison.mjs
      - run: deno check --minimum-dependency-age=60m --node-modules-dir=auto supabase/functions/discover-opportunities/index.ts
      - run: deno test --minimum-dependency-age=60m --node-modules-dir=auto supabase/functions/discover-opportunities/filters_test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run PostgreSQL lifecycle integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoearn_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/database_lifecycle.integration.sql
      - name: Build pinned Zoa agent worker (no API key required)
        run: docker build --tag autoearn-zoa-agent:ci integrations/zoa
