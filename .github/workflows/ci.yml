name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check static/app.js && node --check static/puzzle.js && node --check static/game-agent.js && node --check static/reward-ledger.js && node --test tests/reward-ledger.test.js tests/game-agent.test.js
      - run: deno check --node-modules-dir=auto supabase/functions/discover-opportunities/index.ts
      - run: deno test --node-modules-dir=auto supabase/functions/discover-opportunities/filters_test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Build pinned Zoa agent worker (no API key required)
        run: docker build --tag autoearn-zoa-agent:ci integrations/zoa
