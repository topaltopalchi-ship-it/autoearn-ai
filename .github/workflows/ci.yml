name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare diagnostics
        if: always()
        run: mkdir -p test-results
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Capture environment
        if: always()
        run: |
          {
            echo "=== Python ==="
            python --version 2>&1 || true
            echo "=== Pip ==="
            python -m pip --version 2>&1 || true
            echo "=== Installed packages ==="
            python -m pip freeze 2>&1 || true
            echo "=== Dependency consistency ==="
            python -m pip check 2>&1 || true
          } | tee test-results/environment.txt
      - name: Check Python syntax
        run: python -m compileall -q app autoearn tests
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Run tests with diagnostics
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long --junitxml=test-results/junit.xml 2>&1 | tee test-results/pytest.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
