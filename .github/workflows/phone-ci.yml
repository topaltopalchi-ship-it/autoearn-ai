name: Phone ARM64 CI

on:
  push:
    branches:
      - feat-opportunity-eligibility-payout-details
      - feat-discovery-adapter-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, autoearn-phone]
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Create isolated Python environment
        run: python3 -m venv .venv
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: .venv/bin/python -m pip check
      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q app autoearn tests
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Run test suite
        run: .venv/bin/python -m pytest -vv --tb=long
