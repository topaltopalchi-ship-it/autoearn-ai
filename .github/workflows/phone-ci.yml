name: AutoEarn Python and Dashboard CI

on:
  push:
    branches:
      - feat-opportunity-eligibility-payout-details
      - feat-task-ai-suitability-screening
      - fix-public-research-evidence-url-validation
      - feat-country-aware-discovery-research-queue
  pull_request:
    branches:
      - fix-public-research-evidence-url-validation
  workflow_dispatch:

concurrency:
  group: autoearn-ci-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout selected commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d .git ]; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git init .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show runner versions
        run: |
          python --version
          node --version
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: .venv/bin/python -m pip check
      - name: Audit pinned dependencies for known vulnerabilities
        if: matrix.python-version == '3.12'
        run: |
          .venv/bin/python -m pip install pip-audit
          .venv/bin/pip-audit -r requirements.txt
      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q app autoearn tests scripts
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Run test suite
        run: .venv/bin/python -m pytest -vv --tb=long
