name: Deploy AutoEarn AI to Netlify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node.js for Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "Missing NETLIFY_AUTH_TOKEN repository secret" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "Missing NETLIFY_SITE_ID repository secret" && exit 1)

      - name: Deploy static workspace
        run: npx --yes netlify-cli@27.20.1 deploy --prod --dir=static --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
