name: Deploy AutoEarn AI to Netlify

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "static/**"
      - "netlify.toml"
      - ".github/workflows/netlify-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Deploy static workspace
        run: npx --yes netlify-cli@latest deploy --prod --dir=static --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
