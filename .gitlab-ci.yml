stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

default:
  interruptible: true

python-tests:
  stage: test
  image: python:3.10-slim
  timeout: 20m
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - python --version
    - python -m pip install -r requirements.txt
    - python -m pip check
    - python -m compileall -q app autoearn tests
    - python -m pytest -q --tb=short

dashboard-js:
  stage: test
  image: node:22-alpine
  timeout: 5m
  script:
    - node --version
    - node --check static/app.js
